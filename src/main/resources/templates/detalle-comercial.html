<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Detalle del comercial | Ventas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
	<div class="row"><div class="col-12 col-lg-8">
		<h1 class="h2 mb-4">Detalle del comercial</h1>
		<dl class="row g-2 bg-white p-3 border rounded-2">
			<dt class="col-sm-4">ID</dt><dd class="col-sm-8" th:text="${comercial.id}"></dd>
			<dt class="col-sm-4">Nombre</dt><dd class="col-sm-8" th:text="${comercial.nombre}"></dd>
			<dt class="col-sm-4">Primer apellido</dt><dd class="col-sm-8" th:text="${comercial.apellido1}"></dd>
			<dt class="col-sm-4">Segundo apellido</dt><dd class="col-sm-8" th:text="${comercial.apellido2}"></dd>
			<dt class="col-sm-4">Comisión</dt><dd class="col-sm-8" th:text="${comercial.comision}"></dd>
		</dl>
		<div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/comerciales}">Volver</a><a class="btn btn-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a></div>
	</div></div>
</main>
</body>
</html>
