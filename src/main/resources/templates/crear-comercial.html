<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nuevo comercial | Ventas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
	<div class="row"><div class="col-12 col-lg-8 col-xl-7">
		<h1 class="h2 mb-4">Nuevo comercial</h1>
		<form class="row g-3" th:action="@{/comerciales/crear}" th:object="${comercial}" method="post">
			<div class="col-12 col-md-6"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" th:field="*{nombre}" required maxlength="100"></div>
			<div class="col-12 col-md-6"><label class="form-label" for="apellido1">Primer apellido</label><input class="form-control" id="apellido1" th:field="*{apellido1}" required maxlength="100"></div>
			<div class="col-12 col-md-6"><label class="form-label" for="apellido2">Segundo apellido</label><input class="form-control" id="apellido2" th:field="*{apellido2}" maxlength="100"></div>
			<div class="col-12 col-md-6"><label class="form-label" for="comision">Comisión</label><input class="form-control" id="comision" type="number" min="0" step="any" th:field="*{comision}" required></div>
			<div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/comerciales}">Cancelar</a></div>
		</form>
	</div></div>
</main>
</body>
</html>
