<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Comerciales | Ventas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
	<header class="row align-items-center g-3 mb-4">
		<div class="col-12 col-md-8"><h1 class="h2 mb-0">Comerciales</h1></div>
		<div class="col-12 col-md-4 text-md-end">
			<a class="btn btn-primary" th:href="@{/comerciales/crear}">Nuevo comercial</a>
			<a class="btn btn-outline-secondary" th:href="@{/clientes}">Clientes</a>
		</div>
	</header>
	<div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
	<div class="alert alert-success" role="status" th:if="${mensaje}" th:text="${mensaje}"></div>
	<div class="row">
		<div class="col-12">
			<div class="table-responsive">
				<table class="table table-striped table-hover align-middle bg-white">
					<thead class="table-dark"><tr><th>ID</th><th>Nombre</th><th>Apellidos</th><th>Comisión</th><th>Acciones</th></tr></thead>
					<tbody>
					<tr th:each="comercial : ${listaComerciales}">
						<td th:text="${comercial.id}"></td>
						<td th:text="${comercial.nombre}"></td>
						<td th:text="|${comercial.apellido1} ${comercial.apellido2 ?: ''}|"></td>
						<td th:text="${comercial.comision}"></td>
						<td class="text-nowrap">
							<a class="btn btn-sm btn-outline-primary" th:href="@{/comerciales/{id}(id=${comercial.id})}">Ver</a>
							<a class="btn btn-sm btn-outline-secondary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
							<form class="d-inline" method="post" th:action="@{/comerciales/borrar/{id}(id=${comercial.id})}"><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(listaComerciales)}"><td class="text-center text-secondary py-4" colspan="5">No hay comerciales registrados.</td></tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</main>
</body>
</html>
